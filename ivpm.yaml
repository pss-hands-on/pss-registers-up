# yaml-language-server: $schema=https://fvutils.github.io/ivpm/ivpm.schema.json
package:
  name: pss-registers-up

  dep-sets:
  # What a lab attendee fetches: the tools, plus the design and VIP the
  # testbench is built from. `ivpm update` with no dep-set lands here.
  - name: use
    uses: [tools, design]

  # The device and the VIP the testbench is built from.
  #
  # Every entry carries `deps: skip`: fetch the sources, do not walk the
  # package's own manifest. These are all libraries whose published dep-set is
  # `default-dev` -- a DEVELOPER's environment for that package (cocotb,
  # iverilog, pyhdl-if, the yosys/formal stack, and in one case a nextpnr
  # release whose manifest no longer declares the dep-set its consumer asks
  # for). None of it is on the path from this project's sources to a simulation
  # image, and the cascade is what a lab attendee would spend the download on.
  #
  # The cost of `deps: skip` is that this list is now the complete statement of
  # what the build needs: a genuinely new transitive dependency shows up as a
  # dfm load error naming the missing package, not as a silent fetch.
  - name: design
    deps:
    # The DUT: the OpenCores WISHBONE DMA/Bridge engine. src/rtl/flow.yaml
    # globs its Verilog straight out of $IVPM_PACKAGES/wb_dma/rtl/verilog.
    # No ivpm.yaml of its own -- a plain source checkout.
    - { name: wb_dma, url: https://github.com/freecores/wb_dma.git, anonymous: true }

    # Wishbone UVM VIP: the initiator agent the RAL drives, and the
    # uvm_reg_adapter between them. org.fwvip.wb imports fwvip-core's and
    # fw-proto-wb's flow files, so both have to be on disk.
    - { name: fwvip-wb, url: https://github.com/featherweight-vip/fwvip-wb.git, deps: skip }
    - { name: fwvip-core, url: https://github.com/featherweight-vip/fwvip-core.git, deps: skip }

    # Signal-level Wishbone transactors (wb_initiator_xtor, instanced in
    # tests/uvm/tb/hdl_top.sv), plus fw-hdl -- a COMPILE-time dependency of the
    # transactors even though no bench class references it (the bench binds the
    # virtual-interface specialization of the initiator config; see hvl_top.sv).
    - { name: fw-proto-wb, url: https://github.com/featherweight-ip/fw-proto-wb.git, deps: skip }
    - { name: fw-hdl, url: https://github.com/featherweight-hdl/fw-hdl.git, deps: skip }

  - name: dev
    uses: [use, dev-skills]

  - name: dev-src
    uses: dev
    deps:
    - name: pssc
      url: https://github.com/psstools/pssc.git
      dep-set: dev
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: dv-flow-libhdllint
      url: https://github.com/dv-flow/dv-flow-libhdllint.git
      dep-set: default-dev
    - name: dv-flow-libpss
      url: https://github.com/dv-flow/dv-flow-libpss.git
      dep-set: default-dev
    - name: dv-flow-librdl
      url: https://github.com/dv-flow/dv-flow-librdl.git
      dep-set: default-dev
    - name: dv-flow-libproject
      url: https://github.com/dv-flow/dv-flow-libproject.git
      dep-set: default-dev

    - name: sphinx-dv-flow
      url: https://github.com/dv-flow/sphinx-dv-flow.git
      dep-set: use

  # Agent skills for the two authoring surfaces these labs work in: SystemRDL
  # register descriptions and PSS.
  - name: dev-skills
    default-dep-set: default-dev
    deps:
    - { name: agent-skills-systemrdl, url: https://github.com/fvutils/agent-skills-systemrdl.git }
    - { name: agent-skills-pss, url: https://github.com/psstools/agent-skills-pss.git }

  - name: tools
    deps:
    - name: verilator
      src: ivpm.yaml
      url: https://edapack.github.io/ivpm.yaml
      dep-set: verilator
    - name: pssc
      src: pypi
    - name: dv-flow-mgr
      src: pypi
    - name: dv-flow-libhdlsim
      src: pypi
    - name: dv-flow-libpss
      src: pypi
    - name: dv-flow-librdl
      src: pypi
    # Not published on PyPI -- fetch from git, `deps: skip` for the same reason
    # as dv-flow-libproject below. flow.yaml imports `hdllint` for lint-rtl.
    - name: dv-flow-libhdllint
      url: https://github.com/dv-flow/dv-flow-libhdllint.git
      deps: skip
    # Not published on PyPI -- fetch from git. `deps: skip` for the same reason
    # as the `design` entries: its manifest is a developer environment.
    - name: dv-flow-libproject
      url: https://github.com/dv-flow/dv-flow-libproject.git
      deps: skip
    - name: peakrdl-pss
      src: pypi
    # `rdl.Export format: uvm` (src/rdl/flow.yaml) shells out to this exporter.
    - name: peakrdl-uvm
      src: pypi
